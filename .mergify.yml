merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: resolver-ui-261001
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-conflict-ui-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs

pull_request_rules:
  - name: VM1 stale queue finalizer 261002
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_STALE_QUEUE_FINALIZER_261002
      - check-success = vm1-queue-race-gate
    actions:
      queue:
        name: resolver-ui-261001
