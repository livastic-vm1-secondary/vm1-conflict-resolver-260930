merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: resolver-ui-261001
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-conflict-ui-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs

pull_request_rules:
  - name: VM1 stale github-actions control 261002
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_STALE_GHA_CONTROL_261002
      - -closed
      - check-success = vm1-gha-race-gate
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: vm1-stale-gha-dispatch.yml
              ref: main
              inputs:
                pr_number: "{{ number }}"

  - name: VM1 stale github-actions race 261002
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_STALE_GHA_RACE_261002
      - -closed
      - check-success = vm1-gha-race-gate
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: vm1-stale-gha-dispatch.yml
              ref: main
              inputs:
                pr_number: "{{ number }}"
