merge_queue:
  mode: isolated
  max_parallel_checks: 2
queue_rules:
  - name: resolver-isolated
    queue_conditions:
      - title ~= ^VM1_CR_ISO_[AB]_261001$
    merge_conditions:
      - check-success = vm1-conflict-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs
