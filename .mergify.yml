merge_queue:
  mode: serial
  max_parallel_checks: 1
scopes:
  source:
    files:
      ordinary:
        include:
          - ordinary/**
  barrier_files:
    include:
      - barrier/**
queue_rules:
  - name: dynbar
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-dynbar-hold
    batch_size:
      min: 1
      max: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
