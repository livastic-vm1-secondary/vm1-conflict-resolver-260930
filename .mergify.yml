merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: resolver-ui-261001
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-conflict-ui-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs

pull_request_rules:
  - name: VM1 stale postcheck race 261002
    conditions:
      - base = vm1-postcheck-race-base-261002
      - author = livastic-vm1-secondary
      - title = VM1_POSTCHECK_RACE_261002
      - check-success = vm1-postcheck-race-gate
    actions:
      post_check:
        title: VM1 stale postcheck race canary
        summary: VM1 controlled stale-head post_check discriminator
        success_conditions: true

  - name: VM1 stale postcheck protected merge 261002
    conditions:
      - base = vm1-postcheck-race-base-261002
      - author = livastic-vm1-secondary
      - title = VM1_POSTCHECK_RACE_261002
      - label = vm1-postcheck-impact-261002
      - -closed
    actions:
      merge:
        method: squash
