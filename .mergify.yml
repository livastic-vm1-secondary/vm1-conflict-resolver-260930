merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: resolver-ui-261001
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-conflict-ui-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs

  - name: vm1-rule-removal-queue-261002
    queue_conditions:
      - base = main
      - title = VM1_RULE_REMOVAL_SYNC_261002
    merge_conditions:
      - check-success = vm1-rule-removal-hold
    batch_size: 1
    merge_method: squash

pull_request_rules:
  - name: VM1 removed queue rule cleanup 261002
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_RULE_REMOVAL_SYNC_261002
    actions:
      queue:
        name: vm1-rule-removal-queue-261002
