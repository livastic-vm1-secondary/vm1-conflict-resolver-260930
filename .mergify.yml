merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: resolver-ui-261001
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-conflict-ui-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs

pull_request_rules:
  - name: VM1 stale-review main approval 261001 v2
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_STALE_REVIEW_MAIN_CHAIN_V2_261001
      - check-success = vm1-review-race-gate
    actions:
      review:
        type: APPROVE
        message: VM1 stale-review main-chain approval canary v2

  - name: VM1 stale-review main merge 261001 v2
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_STALE_REVIEW_MAIN_CHAIN_V2_261001
      - -closed
      - approved-reviews-by = mergify[bot]
    actions:
      merge:
        method: squash

  - name: VM1 stale-review protected approval 261002
    conditions:
      - base = vm1-review-race-protected-261002
      - author = livastic-vm1-secondary
      - title = VM1_STALE_REVIEW_PROTECTED_CHAIN_261002
      - check-success = vm1-review-race-gate
    actions:
      review:
        type: APPROVE
        message: VM1 stale-review protected approval canary

  - name: VM1 stale-review protected merge 261002
    conditions:
      - base = vm1-review-race-protected-261002
      - author = livastic-vm1-secondary
      - title = VM1_STALE_REVIEW_PROTECTED_CHAIN_261002
      - -closed
      - approved-reviews-by = mergify[bot]
    actions:
      merge:
        method: squash
