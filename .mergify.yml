merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: resolver-ui-261001
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-conflict-ui-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs

pull_request_rules:
  - name: VM1 dismiss race control 261002
    conditions:
      - base = vm1-dismiss-race-base-261002
      - author = livastic-vm1-secondary
      - title = VM1_DISMISS_RACE_CONTROL_261002
      - check-success = vm1-dismiss-race-gate
    actions:
      dismiss_reviews:
        approved: false
        changes_requested: true
        when: always

  - name: VM1 dismiss race treatment 261002
    conditions:
      - base = vm1-dismiss-race-base-261002
      - author = livastic-vm1-secondary
      - title = VM1_DISMISS_RACE_261002
      - check-success = vm1-dismiss-race-gate
    actions:
      dismiss_reviews:
        approved: false
        changes_requested: true
        when: always

  - name: VM1 dismiss race protected merge 261002
    conditions:
      - base = vm1-dismiss-race-base-261002
      - author = livastic-vm1-secondary
      - title = VM1_DISMISS_RACE_261002
      - label = vm1-dismiss-impact-261002
      - -closed
    actions:
      merge:
        method: squash
