merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: resolver-ui-261001
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-conflict-ui-hold
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - conflict.txt
        strategy: prefer-theirs

pull_request_rules:
  - name: VM1 stale-review chain approval 261001
    conditions:
      - base = vm1-stale-review-chain-base-261001
      - author = livastic-vm1-secondary
      - title = VM1_STALE_REVIEW_CHAIN_261001
      - check-success = vm1-review-race-gate
    actions:
      review:
        type: APPROVE
        message: VM1 stale-review chain approval canary

  - name: VM1 stale-review chain merge 261001
    conditions:
      - base = vm1-stale-review-chain-base-261001
      - author = livastic-vm1-secondary
      - title = VM1_STALE_REVIEW_CHAIN_261001
      - closed = false
      - approved-reviews-by = mergify[bot]
    actions:
      merge:
        method: squash
