name: VM1 Stale Dispatch Proof

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Record current PR head and create proof ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          BASE_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          PROOF_REF="refs/heads/vm1-stale-gha-proof-$RUN_ID"
          echo "PR_HEAD=$HEAD_SHA"
          echo "PROOF_REF=$PROOF_REF"
          gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="$PROOF_REF" -f sha="$BASE_SHA"
