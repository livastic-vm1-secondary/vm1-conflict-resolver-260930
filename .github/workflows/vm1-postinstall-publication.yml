name: VM1 npm package publication chronology 261011

on:
  pull_request:
    branches:
      - vm1-npmovr-base-261009
  push:
    branches:
      - vm1-npmovr-base-261009

permissions:
  contents: read
  packages: write

jobs:
  vm1-npmovr-never-261009:
    runs-on: ubuntu-latest
    steps:
      - name: Harmless merge-queue gate
        run: echo VM1_POSTINSTALL_GATE_OK_261011

  publish-github-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect publishable package
        id: package
        shell: bash
        run: |
          private=$(node -p "String(require('./pkg/package.json').private)")
          echo "private=$private" >> "$GITHUB_OUTPUT"
      - name: Publish immutable npm version
        if: steps.package.outputs.private == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '@mrg-vm1-collab-0911-b4e7:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          cd pkg
          npm publish --registry=https://npm.pkg.github.com
      - name: Install published version with lifecycle scripts
        if: steps.package.outputs.private == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '@mrg-vm1-collab-0911-b4e7:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          name=$(node -p "require('./pkg/package.json').name")
          version=$(node -p "require('./pkg/package.json').version")
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install --foreground-scripts "$name@$version" --registry=https://npm.pkg.github.com
