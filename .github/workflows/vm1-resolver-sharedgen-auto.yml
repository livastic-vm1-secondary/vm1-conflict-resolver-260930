name: VM1 Resolver SharedGen Auto Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  vm1-resolver-sharedgen-auto:
    if: startsWith(github.event.pull_request.title, 'merge queue: checking ') && contains(github.event.pull_request.body, 'vm1-resolver-auto-261002')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for trusted policy generation change
        run: sleep 180
      - name: Finish controlled gate
        run: echo "VM1 automatic resolver gate completed"
